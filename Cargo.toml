[package]
name = "mdrcodec"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
futures = ["dep:futures-io", "dep:futures-util"]

flate2 = ["dep:flate2"]
lz4 = ["dep:lz4"]

[dependencies]
flate2 = { version = "1", optional = true }
futures-io = { version = "0", optional = true }
futures-util = { version = "0", optional = true, features = ["io"] }
lz4 = { version = "1", optional = true }

[dev-dependencies]
futures = "0.3.32"
tokio = { version = "1", features = ["rt", "io-util", "io-std", "macros"] }
